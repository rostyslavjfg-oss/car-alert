name: scrape

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed mode (store listings, send nothing)"
        type: boolean
        default: false

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # --drain lets the bot's commands work without hosting bot.py anywhere:
      # pending /add, /list, button taps are processed here, once per cycle.
      # Set the repo variable SELF_HOSTED_BOT=true if you run bot.py yourself -
      # two getUpdates consumers make Telegram answer one of them with 409.
      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBAPP_URL: ${{ vars.WEBAPP_URL }}
        run: >
          python main.py
          ${{ inputs.seed && '--seed' || '' }}
          ${{ vars.SELF_HOSTED_BOT == 'true' && ' ' || '--drain' }}

      - name: Commit database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listings.db config/brands.json webapp/data
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "data: update listings [skip ci]"
          git pull --rebase --autostash
          git push
